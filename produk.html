<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk - GO UC STORE</title>

<link rel="stylesheet" href="style.css">

<style>
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.price{
    color:#2563eb;
    font-weight:bold;
    font-size:20px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#e5edff;
    color:#2563eb;
    font-size:12px;
    margin-bottom:10px;
}

.buy-btn{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>
<body>

<nav>
  <h2>GO UC STORE</h2>
</nav>

<section>

<h2 style="text-align:center;margin-top:30px;">
Produk Tersedia
</h2>

<div id="productList" class="products">

</div>

</section>

<script>

const API = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSLV9stlLrlPwEodUuvN5tCbSmR5wO8oEkj1atIvDHsWcSu7-QkieUE-zVOiUeN1QKjIAbTg0yNEZa27Pg5fQb2Fg1ZnmZRXT-akmTCGTTwJXPq-abdvrIUfbUFjh5yjtmN5EbPKUOK8HabeFPe0hCYG8Alfc4uSqTVcjI3IxyK3tBQHsFlcDvz8nEcR8jb29d2OmNlrR_ZEhEQqFG-7rAWnSjxMv4GIkxaeHBXNr9gaSYBxSn3A6Rr6QuVNk4T5APD6UoC2SfdbIuoQtMcKFSuKMe3uL9JYEXkNiD-3GtmXwPygHI&lib=MbQlyE6RhjLdsIhe2nAIxHHvjfl9DpTmD";

fetch(API,{
  method:"GET",
  mode:"cors"
})
.then(response => response.json())
.then(data => {

    const productList =
    document.getElementById("productList");

    productList.innerHTML = "";

    data.forEach(item => {

        productList.innerHTML += `
        <div class="product-card">

            <div class="product-info">

                <span class="badge">
                    ${item.jenis}
                </span>

                <h3>${item.nama}</h3>

                <p>${item.deskripsi}</p>

                <div class="price">
                    Rp ${item.harga}
                </div>

                <br>

                <button class="buy-btn">
                    Beli Sekarang
                </button>

            </div>

        </div>
        `;

    });

})
.catch(error => {

    console.log(error);

    document.getElementById("productList").innerHTML =
    "Error: " + error;

});

</script>

</body>
</html>
