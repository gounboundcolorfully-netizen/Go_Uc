<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produk - GO UC STORE</title>

<link rel="stylesheet" href="style.css">

<style>
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.price{
    color:#2563eb;
    font-weight:bold;
    font-size:20px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#e5edff;
    color:#2563eb;
    font-size:12px;
    margin-bottom:10px;
}

.buy-btn{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>
<body>

<nav>
  <h2>GO UC STORE</h2>
</nav>

<section>

<h2 style="text-align:center;margin-top:30px;">
Produk Tersedia
</h2>

<div id="productList" class="products">

</div>

</section>

<script>

document.getElementById("productList").innerHTML =
`
<div class="product-card">
  <div class="product-info">
    <h3>TEST PRODUK</h3>
    <p>Kalau ini muncul berarti HTML jalan</p>
  </div>
</div>
`;

</script>

</body>
</html>
