<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko PO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h2>GO UC STORE</h2>

  <ul>
    <li><a href="#beranda">Beranda</a></li>
    <li><a href="produk.html">Produk</a></li>
    <li><a href="#cek">Cek Pesanan</a></li>
    <li><a href="#kontak">Kontak</a></li>
  </ul>
</nav>

<section class="hero" id="beranda">

  <h1>Produk Ready Stock & Pre Order</h1>

  <p>
    Belanja mudah, cek status pesanan kapan saja.
  </p>

  <a href="#produk">
    <button>Lihat Produk</button>
  </a>

</section>

<section id="produk">

  <h2>Produk Unggulan</h2>

  <div class="cards">

    <div class="card">
      <h3>Hoodie Premium</h3>
      <p>Rp250.000</p>
      <button>Beli</button>
    </div>

    <div class="card">
      <h3>T-Shirt Oversize</h3>
      <p>Rp120.000</p>
      <button>Beli</button>
    </div>

    <div class="card">
      <h3>Jaket Varsity</h3>
      <p>Rp350.000</p>
      <button>Beli</button>
    </div>

  </div>

</section>

<section id="cek">

  <h2>Cek Pesanan</h2>

  <input
  type="text"
  placeholder="Masukkan ID Customer">

  <button>Cek Pesanan</button>

</section>

<section id="kontak">

  <h2>Kontak</h2>

  <p>WhatsApp: 08xxxxxxxxxx</p>

</section>
  
</body>
</html>
